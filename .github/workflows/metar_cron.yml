name: METAR Auto-Collector 24/7 Cron

on:
  schedule:
    # Minimum interval resmi GitHub Actions adalah 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch: # Tombol manual trigger di tab GitHub Actions

jobs:
  ping-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Ping METAR Collector on Vercel (Setiap ~2 Menit)
        run: |
          echo "=== Ping 1 at $(date -u) ==="
          curl -s --max-time 25 "https://metar-code-web-ews.vercel.app/api/metar/latest" || true
          echo ""
          echo "Menunggu 120 detik (2 menit)..."
          sleep 120
          echo "=== Ping 2 at $(date -u) ==="
          curl -s --max-time 25 "https://metar-code-web-ews.vercel.app/api/metar/latest" || true
